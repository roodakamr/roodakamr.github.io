<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- City silhouette -->
  <rect x="80" y="130" width="50" height="220" fill="#0d1a28"/>
  <rect x="150" y="100" width="70" height="250" fill="#0c1825"/>
  <rect x="240" y="150" width="45" height="200" fill="#0d1a28"/>
  <rect x="500" y="120" width="60" height="230" fill="#0c1825"/>
  <rect x="580" y="90" width="80" height="260" fill="#0d1a28"/>
  <rect x="670" y="140" width="55" height="210" fill="#0c1825"/>
  <!-- City lights -->
  <rect x="160" y="110" width="8" height="8" fill="#0a84ff20"/>
  <rect x="180" y="130" width="6" height="6" fill="#ffd70020"/>
  <rect x="590" y="100" width="8" height="8" fill="#0a84ff20"/>
  <rect x="610" y="120" width="6" height="6" fill="#00ff8720"/>

  <!-- HUD Label -->
  <rect x="0" y="0" width="800" height="50" fill="#05080f90"/>
  <text x="40" y="33" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00ff87" filter="url(#glow)">Advanced HUD</text>
  <text x="220" y="33" font-family="Arial,sans-serif" font-size="13" fill="#ffffff50">Fully Customizable Interface</text>
  <text x="680" y="33" font-family="Arial,sans-serif" font-size="12" fill="#0a84ff">09:45 PM</text>

  <!-- MINIMAP - top left -->
  <rect x="30" y="58" width="155" height="155" rx="10" fill="#000000a0" stroke="#00ff8840" stroke-width="1.5"/>
  <circle cx="107" cy="135" r="62" fill="none" stroke="#00ff8815" stroke-width="1"/>
  <circle cx="107" cy="135" r="40" fill="none" stroke="#00ff8810" stroke-width="1"/>
  <line x1="45" y1="135" x2="170" y2="135" stroke="#ffffff15" stroke-width="2"/>
  <line x1="107" y1="68" x2="107" y2="202" stroke="#ffffff15" stroke-width="2"/>
  <!-- Roads -->
  <line x1="60" y1="110" x2="155" y2="110" stroke="#1e2840" stroke-width="5"/>
  <line x1="85" y1="68" x2="85" y2="200" stroke="#1e2840" stroke-width="5"/>
  <line x1="130" y1="80" x2="130" y2="200" stroke="#1e2840" stroke-width="4"/>
  <!-- Blips -->
  <circle cx="107" cy="135" r="6" fill="#00ff87" filter="url(#glow)"/>
  <circle cx="107" cy="135" r="3" fill="#fff"/>
  <circle cx="135" cy="112" r="4" fill="#ff3860"/>
  <circle cx="80" cy="152" r="4" fill="#0a84ff"/>
  <circle cx="128" cy="158" r="3" fill="#ffd700"/>
  <!-- Compass -->
  <text x="103" y="74" font-family="Arial,sans-serif" font-size="10" fill="#ffffff70">N</text>
  <text x="103" y="202" font-family="Arial,sans-serif" font-size="10" fill="#ffffff50">S</text>
  <text x="37" y="139" font-family="Arial,sans-serif" font-size="10" fill="#ffffff50">W</text>
  <text x="165" y="139" font-family="Arial,sans-serif" font-size="10" fill="#ffffff50">E</text>

  <!-- HEALTH BARS - bottom left -->
  <g transform="translate(28, 300)">
    <rect x="0" y="-15" width="90" height="13" rx="0"/>
    <text x="0" y="-4" font-family="Arial,sans-serif" font-size="10" fill="#ff3860cc">Health</text>
    <rect x="0" y="0" width="165" height="13" rx="6" fill="#ff386020"/>
    <rect x="0" y="0" width="124" height="13" rx="6" fill="#ff3860" filter="url(#glow)"/>
    <text x="172" y="12" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ff3860">75%</text>

    <text x="0" y="30" font-family="Arial,sans-serif" font-size="10" fill="#0a84ffcc">Armor</text>
    <rect x="0" y="36" width="165" height="13" rx="6" fill="#0a84ff20"/>
    <rect x="0" y="36" width="148" height="13" rx="6" fill="#0a84ff" filter="url(#glow)"/>
    <text x="172" y="48" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#0a84ff">90%</text>

    <text x="0" y="66" font-family="Arial,sans-serif" font-size="10" fill="#ffd700cc">Hunger</text>
    <rect x="0" y="72" width="165" height="13" rx="6" fill="#ffd70020"/>
    <rect x="0" y="72" width="99" height="13" rx="6" fill="#ffd700"/>
    <text x="172" y="84" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#ffd700">60%</text>

    <text x="0" y="102" font-family="Arial,sans-serif" font-size="10" fill="#00ff87cc">Thirst</text>
    <rect x="0" y="108" width="165" height="13" rx="6" fill="#00ff8720"/>
    <rect x="0" y="108" width="50" height="13" rx="6" fill="#00ff87"/>
    <text x="172" y="120" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#00ff87">30%</text>
  </g>

  <!-- SPEEDOMETER - top right -->
  <rect x="595" y="58" width="178" height="72" rx="12" fill="#00000070" stroke="#0a84ff20" stroke-width="1"/>
  <text x="684" y="90" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">142</text>
  <text x="684" y="118" font-family="Arial,sans-serif" font-size="12" fill="#aaa" text-anchor="middle">km/h</text>

  <!-- MONEY - bottom right -->
  <rect x="575" y="345" width="200" height="90" rx="12" fill="#00000070" stroke="#00ff8825" stroke-width="1"/>
  <text x="590" y="375" font-family="Arial,sans-serif" font-size="12" fill="#aaa">Balance</text>
  <text x="590" y="405" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#00ff87" filter="url(#glow)">$24,850</text>
  <text x="590" y="425" font-family="Arial,sans-serif" font-size="11" fill="#0a84ff">Police - Sergeant</text>

  <!-- NOTIFICATION - center -->
  <rect x="265" y="80" width="270" height="52" rx="10" fill="#00000090" stroke="#00ff8830" stroke-width="1"/>
  <rect x="265" y="80" width="4" height="52" rx="2" fill="#00ff87"/>
  <text x="282" y="103" font-family="Arial,sans-serif" font-size="13" fill="#00ff87" font-weight="bold">Mission Accepted!</text>
  <text x="282" y="122" font-family="Arial,sans-serif" font-size="10" fill="#aaa">Deliver package to Warehouse B</text>

  <!-- WEAPON - right -->
  <rect x="590" y="210" width="185" height="58" rx="10" fill="#00000080" stroke="#ffffff15" stroke-width="1"/>
  <rect x="605" y="226" width="26" height="26" rx="3" fill="#2a2a3a"/>
  <rect x="608" y="229" width="20" height="4" rx="2" fill="#aaa"/>
  <rect x="608" y="236" width="15" height="8" rx="1" fill="#888"/>
  <rect x="608" y="244" width="10" height="10" rx="1" fill="#666"/>
  <text x="638" y="237" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">Pistol Mk II</text>
  <text x="638" y="255" font-family="Arial,sans-serif" font-size="12" fill="#ffd700">124 / 500</text>
  <rect x="638" y="258" width="120" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="638" y="258" width="90" height="5" rx="2" fill="#ffd700"/>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Advanced Custom HUD</text>
</svg>
