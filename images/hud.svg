<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1520"/>
      <stop offset="100%" style="stop-color:#050a10"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Game-like background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- City/environment hint -->
  <rect x="0" y="200" width="800" height="250" fill="#08101808"/>
  <rect x="100" y="160" width="60" height="180" fill="#ffffff04"/>
  <rect x="120" y="140" width="40" height="20" fill="#ffffff03"/>
  <rect x="200" y="180" width="80" height="160" fill="#ffffff04"/>
  <rect x="320" y="150" width="50" height="190" fill="#ffffff03"/>
  <rect x="500" y="170" width="70" height="170" fill="#ffffff04"/>
  <rect x="620" y="145" width="55" height="195" fill="#ffffff03"/>

  <!-- ===== HUD ELEMENTS ===== -->

  <!-- Bottom Left - Health/Armor -->
  <g transform="translate(30, 360)">
    <!-- Health -->
    <text x="0" y="-8" font-family="Arial" font-size="10" fill="#ff3860cc">❤️ الصحة</text>
    <rect x="0" y="0" width="160" height="12" rx="6" fill="#ff386020"/>
    <rect x="0" y="0" width="120" height="12" rx="6" fill="#ff3860" opacity="0.9" filter="url(#glow)"/>
    <text x="168" y="11" font-family="Arial" font-size="11" font-weight="bold" fill="#ff3860">75%</text>

    <!-- Armor -->
    <text x="0" y="28" font-family="Arial" font-size="10" fill="#0a84ffcc">🛡️ الدرع</text>
    <rect x="0" y="36" width="160" height="12" rx="6" fill="#0a84ff20"/>
    <rect x="0" y="36" width="144" height="12" rx="6" fill="#0a84ff" opacity="0.9" filter="url(#glow)"/>
    <text x="168" y="47" font-family="Arial" font-size="11" font-weight="bold" fill="#0a84ff">90%</text>

    <!-- Hunger -->
    <text x="0" y="64" font-family="Arial" font-size="10" fill="#ffd700cc">🍔 الجوع</text>
    <rect x="0" y="72" width="160" height="12" rx="6" fill="#ffd70020"/>
    <rect x="0" y="72" width="96" height="12" rx="6" fill="#ffd700" opacity="0.9"/>
    <text x="168" y="83" font-family="Arial" font-size="11" font-weight="bold" fill="#ffd700">60%</text>

    <!-- Thirst -->
    <text x="0" y="100" font-family="Arial" font-size="10" fill="#00ff87cc">💧 العطش</text>
    <rect x="0" y="108" width="160" height="12" rx="6" fill="#00ff8720"/>
    <rect x="0" y="108" width="48" height="12" rx="6" fill="#00ff87" opacity="0.9" filter="url(#glow)"/>
    <text x="168" y="119" font-family="Arial" font-size="11" font-weight="bold" fill="#00ff87">30%</text>
  </g>

  <!-- Bottom Right - Money & Job -->
  <g transform="translate(580, 350)">
    <rect x="0" y="0" width="190" height="90" rx="12" fill="#00000060" stroke="#00ff8720" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial" font-size="12" fill="#888899">💰 رصيدك</text>
    <text x="15" y="52" font-family="Arial" font-size="24" font-weight="bold" fill="#00ff87" filter="url(#glow2)">$24,850</text>
    <text x="15" y="75" font-family="Arial" font-size="11" fill="#0a84ff">💼 الشرطة • رقيب</text>
  </g>

  <!-- Top Left - Minimap placeholder -->
  <rect x="30" y="30" width="150" height="150" rx="10" fill="#000000a0" stroke="#00ff8730" stroke-width="1"/>
  <circle cx="105" cy="105" r="60" fill="none" stroke="#00ff8715" stroke-width="1"/>
  <circle cx="105" cy="105" r="40" fill="none" stroke="#00ff8710" stroke-width="1"/>
  <circle cx="105" cy="105" r="20" fill="none" stroke="#00ff8710" stroke-width="1"/>
  <!-- Streets on minimap -->
  <line x1="45" y1="105" x2="165" y2="105" stroke="#ffffff15" stroke-width="2"/>
  <line x1="105" y1="45" x2="105" y2="165" stroke="#ffffff15" stroke-width="2"/>
  <line x1="55" y1="65" x2="155" y2="145" stroke="#ffffff08" stroke-width="1"/>
  <!-- Player dot -->
  <circle cx="105" cy="105" r="5" fill="#00ff87" filter="url(#glow)"/>
  <circle cx="105" cy="105" r="2" fill="#ffffff"/>
  <!-- Blips -->
  <circle cx="130" cy="85" r="3" fill="#ff3860"/>
  <circle cx="80" cy="120" r="3" fill="#0a84ff"/>
  <circle cx="125" cy="130" r="3" fill="#ffd700"/>
  <!-- Compass -->
  <text x="100" y="46" font-family="Arial" font-size="10" fill="#ffffff60" text-anchor="middle">N</text>
  <text x="100" y="172" font-family="Arial" font-size="10" fill="#ffffff60" text-anchor="middle">S</text>
  <text x="38" y="110" font-family="Arial" font-size="10" fill="#ffffff60" text-anchor="middle">W</text>
  <text x="163" y="110" font-family="Arial" font-size="10" fill="#ffffff60" text-anchor="middle">E</text>

  <!-- Top Right - Speed/Time -->
  <g transform="translate(590, 30)">
    <rect x="0" y="0" width="180" height="70" rx="12" fill="#00000070" stroke="#0a84ff20" stroke-width="1"/>
    <text x="90" y="30" font-family="Arial" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">142</text>
    <text x="90" y="50" font-family="Arial" font-size="12" fill="#888899" text-anchor="middle">كم/ساعة</text>
    <text x="90" y="65" font-family="Arial" font-size="10" fill="#0a84ff" text-anchor="middle">⬆ تسارع</text>
  </g>

  <!-- Time/Date -->
  <rect x="330" y="15" width="140" height="40" rx="8" fill="#00000060"/>
  <text x="400" y="32" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">09:45 PM</text>
  <text x="400" y="48" font-family="Arial" font-size="10" fill="#888899" text-anchor="middle">الثلاثاء • صافٍ ☀️</text>

  <!-- Notification -->
  <rect x="270" y="80" width="260" height="50" rx="10" fill="#00000080" stroke="#00ff8730" stroke-width="1"/>
  <text x="290" y="101" font-family="Arial" font-size="12" fill="#00ff87">✅ تم قبول المهمة</text>
  <text x="290" y="120" font-family="Arial" font-size="10" fill="#888899">توصيل طرد إلى المستودع B</text>

  <!-- Weapon indicator -->
  <g transform="translate(620, 200)">
    <rect x="0" y="0" width="150" height="55" rx="10" fill="#00000070" stroke="#ffffff10" stroke-width="1"/>
    <text x="15" y="22" font-family="Arial" font-size="20">🔫</text>
    <text x="45" y="22" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Pistol Mk II</text>
    <text x="15" y="44" font-family="Arial" font-size="12" fill="#ffd700">124 / 500</text>
    <rect x="90" y="36" width="50" height="6" rx="3" fill="#1a1a2e"/>
    <rect x="90" y="36" width="38" height="6" rx="3" fill="#ffd700"/>
  </g>

  <text x="400" y="440" font-family="Arial" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts • HUD المتطور</text>
</svg>
