<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="purp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#purp)"/>
  <rect x="0" y="0" width="800" height="60" fill="#060810"/>
  <rect width="800" height="6" fill="url(#purp)"/>
  <text x="36" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#9b59b6" filter="url(#glow)">Secret Lab System</text>
  <text x="260" y="38" font-family="Arial,sans-serif" font-size="13" fill="#ffffff50">Underground Drug Network</text>
  <rect x="630" y="16" width="150" height="28" rx="7" fill="#00ff8715" stroke="#00ff8740" stroke-width="1"/>
  <circle cx="648" cy="30" r="5" fill="#00ff87"/>
  <text x="660" y="35" font-family="Arial,sans-serif" font-size="11" fill="#00ff87">Lab: Active</text>

  <!-- Left - Crafting -->
  <rect x="20" y="72" width="220" height="365" rx="12" fill="#0c0a1a" stroke="#9b59b620" stroke-width="1"/>
  <text x="36" y="99" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Crafting Menu</text>

  <rect x="30" y="108" width="200" height="54" rx="8" fill="#9b59b615" stroke="#9b59b650" stroke-width="2"/>
  <rect x="30" y="108" width="5" height="54" rx="2" fill="#9b59b6"/>
  <text x="46" y="130" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#9b59b6">Crystal Meth</text>
  <text x="46" y="150" font-family="Arial,sans-serif" font-size="10" fill="#888">Profit: $3,200 per unit</text>

  <rect x="30" y="168" width="200" height="54" rx="8" fill="#10101e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="190" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Cocaine</text>
  <text x="46" y="210" font-family="Arial,sans-serif" font-size="10" fill="#888">Profit: $5,800 per unit</text>

  <rect x="30" y="228" width="200" height="54" rx="8" fill="#10101e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="250" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Heroin</text>
  <text x="46" y="270" font-family="Arial,sans-serif" font-size="10" fill="#888">Profit: $7,200 per unit</text>

  <rect x="30" y="288" width="200" height="54" rx="8" fill="#10101e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="310" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Weed</text>
  <text x="46" y="330" font-family="Arial,sans-serif" font-size="10" fill="#888">Profit: $1,100 per unit</text>

  <rect x="30" y="360" width="200" height="40" rx="10" fill="url(#purp)"/>
  <text x="130" y="384" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Start Crafting</text>

  <!-- Center - Lab visual -->
  <rect x="254" y="72" width="300" height="268" rx="12" fill="#0c0a1a" stroke="#9b59b620" stroke-width="1"/>
  <text x="404" y="99" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0" text-anchor="middle">Live Lab View</text>

  <!-- Lab equipment -->
  <g transform="translate(404, 200)">
    <!-- Table surface -->
    <rect x="-135" y="48" width="270" height="8" rx="4" fill="#1a1a2e"/>
    <!-- Large beaker -->
    <rect x="-25" y="-45" width="50" height="90" rx="8" fill="#9b59b615" stroke="#9b59b650" stroke-width="2"/>
    <rect x="-20" y="0" width="40" height="42" rx="4" fill="#9b59b625"/>
    <!-- Liquid bubbles -->
    <circle cx="-5" cy="20" r="5" fill="#9b59b660"/>
    <circle cx="8" cy="10" r="3" fill="#9b59b650"/>
    <circle cx="-12" cy="5" r="4" fill="#9b59b640"/>
    <!-- Tube left -->
    <rect x="-100" y="-15" width="25" height="60" rx="5" fill="#9b59b620" stroke="#9b59b640" stroke-width="1"/>
    <rect x="-97" y="20" width="19" height="25" rx="3" fill="#9b59b630"/>
    <!-- Tube right -->
    <rect x="75" y="5" width="35" height="40" rx="5" fill="#00ff8720" stroke="#00ff8740" stroke-width="1"/>
    <rect x="78" y="20" width="29" height="22" rx="3" fill="#00ff8730"/>
    <!-- Connecting pipe -->
    <line x1="25" y1="-10" x2="75" y2="-10" stroke="#9b59b640" stroke-width="3"/>
    <line x1="75" y1="-10" x2="75" y2="10" stroke="#9b59b640" stroke-width="3"/>
    <!-- Small flask -->
    <rect x="-130" y="10" width="28" height="36" rx="6" fill="#ffd70020" stroke="#ffd70040" stroke-width="1"/>
    <rect x="-128" y="24" width="24" height="20" rx="3" fill="#ffd70030"/>
  </g>

  <!-- Progress bar -->
  <text x="274" y="318" font-family="Arial,sans-serif" font-size="11" fill="#888">Progress: 67%</text>
  <rect x="274" y="326" width="260" height="12" rx="6" fill="#1a1a2e"/>
  <rect x="274" y="326" width="174" height="12" rx="6" fill="#9b59b6" filter="url(#glow)"/>
  <text x="274" y="354" font-family="Arial,sans-serif" font-size="11" fill="#888">Time remaining: 8 minutes</text>

  <!-- Inventory -->
  <rect x="254" y="345" width="300" height="92" rx="12" fill="#0c0a1a" stroke="#9b59b620" stroke-width="1"/>
  <text x="270" y="368" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#888">Current Inventory</text>

  <rect x="264" y="378" width="84" height="48" rx="8" fill="#9b59b615" stroke="#9b59b630" stroke-width="1"/>
  <rect x="280" y="384" width="12" height="20" rx="2" fill="#9b59b650"/>
  <rect x="296" y="386" width="8" height="16" rx="1" fill="#9b59b640"/>
  <text x="306" y="416" font-family="Arial,sans-serif" font-size="10" fill="#9b59b6" text-anchor="end">14 units</text>

  <rect x="356" y="378" width="84" height="48" rx="8" fill="#00ff8715" stroke="#00ff8730" stroke-width="1"/>
  <text x="398" y="408" font-family="Arial,sans-serif" font-size="22" fill="#00ff87" text-anchor="middle">W</text>
  <text x="398" y="420" font-family="Arial,sans-serif" font-size="10" fill="#00ff87" text-anchor="middle">32 units</text>

  <rect x="448" y="378" width="84" height="48" rx="8" fill="#ffd70015" stroke="#ffd70030" stroke-width="1"/>
  <rect x="474" y="384" width="30" height="30" rx="15" fill="#ffd70030"/>
  <text x="489" y="405" font-family="Arial,sans-serif" font-size="14" fill="#ffd700" text-anchor="middle">P</text>
  <text x="489" y="420" font-family="Arial,sans-serif" font-size="10" fill="#ffd700" text-anchor="middle">7 units</text>

  <!-- Right - Market -->
  <rect x="568" y="72" width="212" height="365" rx="12" fill="#0c0a1a" stroke="#9b59b620" stroke-width="1"/>
  <text x="584" y="99" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Black Market</text>

  <rect x="578" y="108" width="192" height="58" rx="8" fill="#00ff8710" stroke="#00ff8720" stroke-width="1"/>
  <text x="594" y="128" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Street Buyer</text>
  <text x="594" y="146" font-family="Arial,sans-serif" font-size="12" fill="#00ff87">$3,200 / unit</text>
  <text x="594" y="160" font-family="Arial,sans-serif" font-size="9" fill="#888">Wants: 10 units</text>

  <rect x="578" y="172" width="192" height="58" rx="8" fill="#9b59b610" stroke="#9b59b620" stroke-width="1"/>
  <text x="594" y="192" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Port Contact</text>
  <text x="594" y="210" font-family="Arial,sans-serif" font-size="12" fill="#9b59b6">$4,500 / unit</text>
  <text x="594" y="224" font-family="Arial,sans-serif" font-size="9" fill="#888">Wants: 5 units</text>

  <rect x="578" y="236" width="192" height="58" rx="8" fill="#ffd70010" stroke="#ffd70020" stroke-width="1"/>
  <text x="594" y="256" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">VIP Client</text>
  <text x="594" y="274" font-family="Arial,sans-serif" font-size="12" fill="#ffd700">$6,000 / unit</text>
  <text x="594" y="288" font-family="Arial,sans-serif" font-size="9" fill="#888">Wants: 3 units</text>

  <rect x="578" y="300" width="192" height="52" rx="8" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <text x="594" y="320" font-family="Arial,sans-serif" font-size="11" fill="#ff3860">Risk Level</text>
  <rect x="594" y="328" width="158" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="594" y="328" width="98" height="8" rx="4" fill="#ff3860"/>
  <text x="678" y="340" font-family="Arial,sans-serif" font-size="9" fill="#ff3860">62%</text>

  <rect x="578" y="358" width="192" height="40" rx="10" fill="url(#purp)"/>
  <text x="674" y="382" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Sell Now</text>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Advanced Drug System</text>
</svg>
