<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#blue)"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="65" fill="#06091a"/>
  <rect width="800" height="6" fill="url(#blue)"/>
  <text x="40" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0a84ff" filter="url(#glow)">Vehicle Shop</text>
  <text x="210" y="42" font-family="Arial,sans-serif" font-size="14" fill="#ffffff60">Custom Car Dealer</text>
  <!-- Tabs -->
  <rect x="420" y="18" width="80" height="30" rx="6" fill="#0a84ff"/>
  <text x="460" y="37" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Cars</text>
  <rect x="506" y="18" width="80" height="30" rx="6" fill="#0d1a30"/>
  <text x="546" y="37" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Bikes</text>
  <rect x="592" y="18" width="80" height="30" rx="6" fill="#0d1a30"/>
  <text x="632" y="37" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Trucks</text>
  <rect x="678" y="18" width="80" height="30" rx="6" fill="#0d1a30"/>
  <text x="718" y="37" font-family="Arial,sans-serif" font-size="11" fill="#aaa" text-anchor="middle">Military</text>

  <!-- Car preview area -->
  <rect x="20" y="78" width="480" height="250" rx="14" fill="#0a1020" stroke="#0a84ff20" stroke-width="1.5"/>
  <text x="260" y="110" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Vapid Dominator GTT</text>
  <text x="260" y="132" font-family="Arial,sans-serif" font-size="12" fill="#0a84ff" text-anchor="middle">Premium Sport</text>

  <!-- Car body -->
  <g transform="translate(260, 215)">
    <ellipse cx="0" cy="28" rx="160" ry="22" fill="#06090f"/>
    <rect x="-150" y="-5" width="300" height="35" rx="10" fill="#1a2a45"/>
    <rect x="-110" y="-40" width="220" height="40" rx="10" fill="#1e3050"/>
    <!-- Windows -->
    <rect x="-100" y="-37" width="88" height="30" rx="5" fill="#0a84ff25" stroke="#0a84ff30" stroke-width="1"/>
    <rect x="12" y="-37" width="88" height="30" rx="5" fill="#0a84ff25" stroke="#0a84ff30" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="-100" cy="26" r="22" fill="#111"/>
    <circle cx="-100" cy="26" r="14" fill="#1a1a2a"/>
    <circle cx="-100" cy="26" r="6" fill="#0a84ff80"/>
    <circle cx="100" cy="26" r="22" fill="#111"/>
    <circle cx="100" cy="26" r="14" fill="#1a1a2a"/>
    <circle cx="100" cy="26" r="6" fill="#0a84ff80"/>
    <!-- Headlights -->
    <rect x="-155" y="-1" width="18" height="12" rx="3" fill="#0a84ff" filter="url(#glow)"/>
    <rect x="137" y="-1" width="18" height="12" rx="3" fill="#ff4444cc"/>
    <!-- Roof accent -->
    <line x1="-108" y1="-5" x2="108" y2="-5" stroke="#0a84ff40" stroke-width="1"/>
  </g>

  <!-- Nav dots -->
  <circle cx="245" cy="318" r="6" fill="#0a84ff" filter="url(#glow)"/>
  <circle cx="262" cy="318" r="4" fill="#33333a"/>
  <circle cx="275" cy="318" r="4" fill="#33333a"/>
  <circle cx="288" cy="318" r="4" fill="#33333a"/>

  <!-- Arrows -->
  <rect x="30" y="193" width="40" height="40" rx="20" fill="#0d1a2e" stroke="#0a84ff40" stroke-width="1"/>
  <text x="50" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0a84ff" text-anchor="middle">&#8249;</text>
  <rect x="450" y="193" width="40" height="40" rx="20" fill="#0d1a2e" stroke="#0a84ff40" stroke-width="1"/>
  <text x="470" y="219" font-family="Arial,sans-serif" font-size="20" fill="#0a84ff" text-anchor="middle">&#8250;</text>

  <!-- Right panel -->
  <rect x="516" y="78" width="264" height="370" rx="14" fill="#0a1020" stroke="#0a84ff20" stroke-width="1.5"/>
  <!-- Price -->
  <rect x="530" y="96" width="236" height="70" rx="10" fill="#0d1530"/>
  <text x="648" y="120" font-family="Arial,sans-serif" font-size="12" fill="#aaaacc" text-anchor="middle">Price</text>
  <text x="648" y="152" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#00ff87" text-anchor="middle" filter="url(#glow)">$285,000</text>
  <!-- Stats -->
  <text x="532" y="190" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#aaaacc">Specs</text>

  <text x="532" y="213" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Speed</text>
  <rect x="532" y="220" width="200" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="532" y="220" width="175" height="8" rx="4" fill="#0a84ff"/>
  <text x="738" y="228" font-family="Arial,sans-serif" font-size="10" fill="#0a84ff">87</text>

  <text x="532" y="248" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Acceleration</text>
  <rect x="532" y="255" width="200" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="532" y="255" width="160" height="8" rx="4" fill="#00ff87"/>
  <text x="738" y="263" font-family="Arial,sans-serif" font-size="10" fill="#00ff87">80</text>

  <text x="532" y="283" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Handling</text>
  <rect x="532" y="290" width="200" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="532" y="290" width="140" height="8" rx="4" fill="#ffd700"/>
  <text x="738" y="298" font-family="Arial,sans-serif" font-size="10" fill="#ffd700">70</text>

  <text x="532" y="318" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Braking</text>
  <rect x="532" y="325" width="200" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="532" y="325" width="150" height="8" rx="4" fill="#ff3860"/>
  <text x="738" y="333" font-family="Arial,sans-serif" font-size="10" fill="#ff3860">75</text>

  <!-- Colors -->
  <text x="532" y="358" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#aaaacc">Colors</text>
  <circle cx="548" cy="378" r="11" fill="#ff3860"/>
  <circle cx="572" cy="378" r="11" fill="#0a84ff"/>
  <circle cx="596" cy="378" r="11" fill="#00ff87" stroke="#00ff87" stroke-width="2"/>
  <circle cx="620" cy="378" r="11" fill="#ffd700"/>
  <circle cx="644" cy="378" r="11" fill="#ffffff"/>
  <circle cx="668" cy="378" r="11" fill="#333344"/>

  <!-- Buy button -->
  <rect x="530" y="400" width="236" height="38" rx="10" fill="url(#blue)"/>
  <text x="648" y="424" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Buy Now</text>

  <!-- Bottom bar -->
  <rect x="20" y="340" width="480" height="108" rx="12" fill="#07101a" stroke="#0a84ff10" stroke-width="1"/>
  <text x="40" y="363" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Category</text>
  <text x="160" y="363" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Top Speed</text>
  <text x="290" y="363" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Engine</text>
  <text x="400" y="363" font-family="Arial,sans-serif" font-size="11" fill="#aaa">Seats</text>
  <text x="40" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0a84ff">Sport</text>
  <text x="160" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#00ff87">320 km/h</text>
  <text x="290" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffd700">V8 Turbo</text>
  <text x="400" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Custom Vehicle Shop</text>
</svg>
