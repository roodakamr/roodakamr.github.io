  <rect x="588" y="108" width="182" height="60" rx="8" fill="#ff8c0015" stroke="#ff8c0025" stroke-width="1"/>
  <text x="679" y="128" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Reward</text>
  <text x="679" y="158" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#ff8c00" text-anchor="middle" filter="url(#glow)">$1,200</text>

  <rect x="588" y="178" width="182" height="52" rx="8" fill="#10121e"/>
  <text x="603" y="198" font-family="Arial,sans-serif" font-size="11" fill="#888">Pickup</text>
  <text x="603" y="218" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Downtown Warehouse</text>

  <rect x="588" y="238" width="182" height="52" rx="8" fill="#10121e"/>
  <text x="603" y="258" font-family="Arial,sans-serif" font-size="11" fill="#888">Deliver To</text>
  <text x="603" y="278" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#00ff87">East Luxury District</text>

  <text x="594" y="312" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#888">Package Info</text>
  <rect x="588" y="320" width="182" height="28" rx="6" fill="#10121e"/>
  <text x="603" y="338" font-family="Arial,sans-serif" font-size="10" fill="#e0e0f0">Electronics - Handle with care</text>
  <rect x="588" y="354" width="182" height="28" rx="6" fill="#10121e"/>
  <text x="603" y="372" font-family="Arial,sans-serif" font-size="10" fill="#e0e0f0">Quantity: 4 packages</text>
  <rect x="588" y="388" width="182" height="28" rx="6" fill="#ffd70010" stroke="#ffd70020" stroke-width="1"/>
  <text x="603" y="406" font-family="Arial,sans-serif" font-size="10" fill="#ffd700">Bonus: On-time +$200</text>

  <rect x="588" y="424" width="182" height="0" rx="8"/>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Advanced Delivery System</text>
</svg>
