  <line x1="284" y1="148" x2="554" y2="148" stroke="#ffffff06" stroke-width="1"/>
  <line x1="284" y1="188" x2="554" y2="188" stroke="#ffffff06" stroke-width="1"/>
  <line x1="284" y1="228" x2="554" y2="228" stroke="#ffffff06" stroke-width="1"/>
  <line x1="284" y1="268" x2="554" y2="268" stroke="#ffffff06" stroke-width="1"/>
  <line x1="324" y1="108" x2="324" y2="358" stroke="#ffffff06" stroke-width="1"/>
  <line x1="374" y1="108" x2="374" y2="358" stroke="#ffffff06" stroke-width="1"/>
  <line x1="424" y1="108" x2="424" y2="358" stroke="#ffffff06" stroke-width="1"/>
  <line x1="484" y1="108" x2="484" y2="358" stroke="#ffffff06" stroke-width="1"/>
  <line x1="534" y1="108" x2="534" y2="358" stroke="#ffffff06" stroke-width="1"/>

