  <!-- Active order -->
  <rect x="30" y="108" width="220" height="78" rx="10" fill="#ff8c0015" stroke="#ff8c0060" stroke-width="2"/>
  <rect x="30" y="108" width="5" height="78" rx="2" fill="#ff8c00"/>
  <text x="46" y="128" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Order #D-2847</text>
  <rect x="165" y="112" width="76" height="18" rx="5" fill="#ff8c00"/>
  <text x="203" y="124" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">IN PROGRESS</text>
  <text x="46" y="148" font-family="Arial,sans-serif" font-size="11" fill="#888">Electronics x4 packages</text>
  <text x="46" y="166" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ff8c00">+$1,200 reward</text>

  <!-- Order 2 -->
  <rect x="30" y="194" width="220" height="68" rx="10" fill="#10121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="214" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Order #D-2831</text>
  <rect x="168" y="198" width="72" height="18" rx="5" fill="#00ff8720" stroke="#00ff8840" stroke-width="1"/>
  <text x="204" y="211" font-family="Arial,sans-serif" font-size="9" fill="#00ff87" text-anchor="middle">COMPLETED</text>
  <text x="46" y="234" font-family="Arial,sans-serif" font-size="10" fill="#888">Food delivery - 5 boxes</text>
  <text x="46" y="252" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#00ff87">+$850</text>

  <!-- Order 3 -->
  <rect x="30" y="270" width="220" height="68" rx="10" fill="#10121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="290" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Order #D-2819</text>
  <rect x="168" y="274" width="72" height="18" rx="5" fill="#0a84ff20" stroke="#0a84ff40" stroke-width="1"/>
  <text x="204" y="287" font-family="Arial,sans-serif" font-size="9" fill="#0a84ff" text-anchor="middle">PENDING</text>
  <text x="46" y="310" font-family="Arial,sans-serif" font-size="10" fill="#888">Medical - Urgent</text>
  <text x="46" y="328" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0a84ff">+$2,400</text>

