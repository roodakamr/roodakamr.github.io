  <text x="80" y="374" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Today</text>
  <text x="80" y="400" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ff8c00" text-anchor="middle">7</text>
