  <rect x="354" y="115" width="104" height="46" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="476" y="115" width="70" height="46" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="290" y="178" width="46" height="63" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="354" y="178" width="104" height="63" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="476" y="178" width="70" height="63" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="290" y="258" width="46" height="60" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>
  <rect x="476" y="258" width="70" height="60" rx="3" fill="#0f1828" stroke="#1e2a40" stroke-width="1"/>

  <!-- Route path -->
  <polyline points="380,320 380,248 464,248 464,168 500,168" stroke="#ff8c00" stroke-width="3" fill="none" stroke-dasharray="6,4" opacity="0.9" filter="url(#glow)"/>

  <!-- Start marker (warehouse) -->
  <circle cx="380" cy="320" r="10" fill="#ff8c00" filter="url(#glow)"/>
  <text x="380" y="324" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">W</text>
  <!-- Delivery truck (current position) -->
  <rect x="378" y="243" width="16" height="10" rx="2" fill="#ff8c00" filter="url(#glow)"/>
  <circle cx="381" cy="254" r="3" fill="#222"/>
  <circle cx="390" cy="254" r="3" fill="#222"/>
  <!-- Destination marker -->
  <circle cx="500" cy="168" r="10" fill="#00ff87" filter="url(#glow)"/>
  <text x="500" y="172" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">D</text>

