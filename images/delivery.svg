<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="org" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#e67300"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#org)"/>
  <rect x="0" y="0" width="800" height="60" fill="#060810"/>
  <rect width="800" height="6" fill="url(#org)"/>
  <text x="36" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ff8c00" filter="url(#glow)">Delivery System</text>
  <text x="210" y="38" font-family="Arial,sans-serif" font-size="13" fill="#ffffff50">Fast City Logistics</text>
  <rect x="590" y="16" width="190" height="28" rx="7" fill="#ff8c0015" stroke="#ff8c0040" stroke-width="1"/>
  <text x="608" y="34" font-family="Arial,sans-serif" font-size="12" fill="#ff8c00">Active Order: #D-2847</text>

