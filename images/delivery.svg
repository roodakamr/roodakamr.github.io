  <text x="430" y="420" font-family="Arial,sans-serif" font-size="11" fill="#888">Distance: 3.2 km</text>

  <!-- Right - Details -->
  <rect x="578" y="72" width="202" height="365" rx="12" fill="#0c0e16" stroke="#ff8c0020" stroke-width="1"/>
