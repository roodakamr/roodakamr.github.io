<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff87"/>
      <stop offset="100%" style="stop-color:#00cc6a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff08" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="450" stroke="#ffffff08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="#ffffff08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="450" stroke="#ffffff08" stroke-width="1"/>

  <!-- Main Panel -->
  <rect x="40" y="40" width="480" height="370" rx="16" fill="#12121e" stroke="#00ff8730" stroke-width="1.5"/>

  <!-- Panel Header -->
  <rect x="40" y="40" width="480" height="60" rx="16" fill="#1a1a2e"/>
  <rect x="40" y="80" width="480" height="20" fill="#1a1a2e"/>
  <text x="70" y="78" font-family="Arial" font-size="18" font-weight="bold" fill="#00ff87" filter="url(#glow)">💼 نظام الوظائف</text>
  <text x="380" y="78" font-family="Arial" font-size="12" fill="#888899">v2.4.1</text>

  <!-- Job Cards -->
  <!-- Card 1 - Police -->
  <rect x="60" y="120" width="200" height="90" rx="10" fill="#1a1a2e" stroke="#00ff8720" stroke-width="1"/>
  <rect x="60" y="120" width="4" height="90" rx="2" fill="#0a84ff"/>
  <text x="76" y="145" font-family="Arial" font-size="22">🚔</text>
  <text x="106" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#e8e8f0">الشرطة</text>
  <text x="106" y="163" font-family="Arial" font-size="11" fill="#888899">Police Department</text>
  <rect x="76" y="172" width="80" height="6" rx="3" fill="#1f2033"/>
  <rect x="76" y="172" width="60" height="6" rx="3" fill="#0a84ff"/>
  <text x="164" y="180" font-family="Arial" font-size="10" fill="#0a84ff">75%</text>
  <text x="76" y="200" font-family="Arial" font-size="10" fill="#888899">المرتبة: رقيب</text>

  <!-- Card 2 - EMS -->
  <rect x="280" y="120" width="200" height="90" rx="10" fill="#1a1a2e" stroke="#00ff8720" stroke-width="1"/>
  <rect x="280" y="120" width="4" height="90" rx="2" fill="#ff3860"/>
  <text x="296" y="145" font-family="Arial" font-size="22">🚑</text>
  <text x="326" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#e8e8f0">الإسعاف</text>
  <text x="326" y="163" font-family="Arial" font-size="11" fill="#888899">Emergency Medical</text>
  <rect x="296" y="172" width="80" height="6" rx="3" fill="#1f2033"/>
  <rect x="296" y="172" width="45" height="6" rx="3" fill="#ff3860"/>
  <text x="384" y="180" font-family="Arial" font-size="10" fill="#ff3860">56%</text>
  <text x="296" y="200" font-family="Arial" font-size="10" fill="#888899">المرتبة: مسعف</text>

  <!-- Card 3 - Mechanic -->
  <rect x="60" y="230" width="200" height="90" rx="10" fill="#1a1a2e" stroke="#00ff8720" stroke-width="1"/>
  <rect x="60" y="230" width="4" height="90" rx="2" fill="#ffd700"/>
  <text x="76" y="255" font-family="Arial" font-size="22">🔧</text>
  <text x="106" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#e8e8f0">الميكانيكي</text>
  <text x="106" y="273" font-family="Arial" font-size="11" fill="#888899">Mechanic Shop</text>
  <rect x="76" y="282" width="80" height="6" rx="3" fill="#1f2033"/>
  <rect x="76" y="282" width="70" height="6" rx="3" fill="#ffd700"/>
  <text x="164" y="290" font-family="Arial" font-size="10" fill="#ffd700">87%</text>
  <text x="76" y="310" font-family="Arial" font-size="10" fill="#888899">المرتبة: خبير</text>

  <!-- Card 4 - Taxi -->
  <rect x="280" y="230" width="200" height="90" rx="10" fill="#1a1a2e" stroke="#00ff8720" stroke-width="1"/>
  <rect x="280" y="230" width="4" height="90" rx="2" fill="#00ff87"/>
  <text x="296" y="255" font-family="Arial" font-size="22">🚕</text>
  <text x="326" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#e8e8f0">التاكسي</text>
  <text x="326" y="273" font-family="Arial" font-size="11" fill="#888899">Taxi Service</text>
  <rect x="296" y="282" width="80" height="6" rx="3" fill="#1f2033"/>
  <rect x="296" y="282" width="30" height="6" rx="3" fill="#00ff87"/>
  <text x="384" y="290" font-family="Arial" font-size="10" fill="#00ff87">37%</text>
  <text x="296" y="310" font-family="Arial" font-size="10" fill="#888899">المرتبة: سائق</text>

  <!-- Side Stats Panel -->
  <rect x="560" y="40" width="200" height="370" rx="16" fill="#12121e" stroke="#00ff8730" stroke-width="1.5"/>
  <text x="580" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#00ff87">📊 إحصائياتك</text>

  <rect x="575" y="90" width="170" height="55" rx="8" fill="#1a1a2e"/>
  <text x="590" y="112" font-family="Arial" font-size="11" fill="#888899">الراتب الشهري</text>
  <text x="590" y="133" font-family="Arial" font-size="20" font-weight="bold" fill="#00ff87" filter="url(#glow)">$8,500</text>

  <rect x="575" y="155" width="170" height="55" rx="8" fill="#1a1a2e"/>
  <text x="590" y="177" font-family="Arial" font-size="11" fill="#888899">ساعات العمل</text>
  <text x="590" y="198" font-family="Arial" font-size="20" font-weight="bold" fill="#0a84ff">142 ساعة</text>

  <rect x="575" y="220" width="170" height="55" rx="8" fill="#1a1a2e"/>
  <text x="590" y="242" font-family="Arial" font-size="11" fill="#888899">المهام المكتملة</text>
  <text x="590" y="263" font-family="Arial" font-size="20" font-weight="bold" fill="#ffd700">267</text>

  <!-- Active Job indicator -->
  <rect x="575" y="285" width="170" height="40" rx="8" fill="#00ff8715" stroke="#00ff8740" stroke-width="1"/>
  <circle cx="592" cy="305" r="5" fill="#00ff87"/>
  <text x="604" y="309" font-family="Arial" font-size="12" fill="#00ff87">وظيفة نشطة</text>

  <!-- Bottom buttons -->
  <rect x="575" y="335" width="80" height="32" rx="8" fill="url(#green)"/>
  <text x="588" y="355" font-family="Arial" font-size="12" font-weight="bold" fill="#000">تحديث</text>
  <rect x="663" y="335" width="80" height="32" rx="8" fill="#1a1a2e" stroke="#00ff8740" stroke-width="1"/>
  <text x="680" y="355" font-family="Arial" font-size="12" fill="#00ff87">تفاصيل</text>

  <!-- RoodaScripts watermark -->
  <text x="400" y="432" font-family="Arial" font-size="11" fill="#ffffff20" text-anchor="middle">RoodaScripts • نظام الوظائف المتقدم</text>
</svg>
