  <text x="442" y="186" font-family="Arial,sans-serif" font-size="10" fill="#888">Plate Number</text>
  <text x="442" y="204" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0a84ff">ABC-2847</text>

