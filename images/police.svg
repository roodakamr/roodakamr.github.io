  <text x="314" y="261" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Armed Robbery - 15/03/2024</text>
  <rect x="288" y="278" width="284" height="30" rx="6" fill="#ffd70015" stroke="#ffd70025" stroke-width="1"/>
  <circle cx="302" cy="293" r="5" fill="#ffd700"/>
  <text x="314" y="297" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Property Damage - 08/02/2024</text>
  <rect x="288" y="314" width="284" height="30" rx="6" fill="#ff386015" stroke="#ff386025" stroke-width="1"/>
  <circle cx="302" cy="329" r="5" fill="#ff3860"/>
  <text x="314" y="333" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Resisting Arrest - 22/01/2024</text>

  <!-- Action buttons -->
  <rect x="288" y="358" width="128" height="36" rx="8" fill="#ff3860"/>
  <text x="352" y="381" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Arrest Now</text>
  <rect x="426" y="358" width="128" height="36" rx="8" fill="#0a84ff20" stroke="#0a84ff50" stroke-width="1"/>
  <text x="490" y="381" font-family="Arial,sans-serif" font-size="12" fill="#0a84ff" text-anchor="middle">Add Report</text>

  <!-- Right panel - Dispatch map -->
  <rect x="602" y="72" width="178" height="365" rx="12" fill="#0a0f1f" stroke="#0a84ff20" stroke-width="1"/>
  <text x="618" y="99" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Dispatch</text>
  <rect x="612" y="108" width="158" height="130" rx="8" fill="#060c16"/>
  <!-- Map grid -->
  <line x1="612" y1="173" x2="770" y2="173" stroke="#ffffff08" stroke-width="1"/>
  <line x1="691" y1="108" x2="691" y2="238" stroke="#ffffff08" stroke-width="1"/>
  <!-- Blips on map -->
  <circle cx="648" cy="148" r="7" fill="#ff3860" filter="url(#glow)"/>
  <circle cx="720" cy="180" r="7" fill="#0a84ff" filter="url(#glow)"/>
  <circle cx="635" cy="200" r="6" fill="#ffd700"/>
  <circle cx="750" cy="130" r="5" fill="#00ff87"/>
  <!-- Unit labels -->
  <text x="648" y="145" font-family="Arial,sans-serif" font-size="7" fill="#fff" text-anchor="middle">U1</text>
  <text x="720" y="177" font-family="Arial,sans-serif" font-size="7" fill="#fff" text-anchor="middle">U4</text>

  <!-- Active units list -->
  <text x="618" y="256" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#888">Active Units</text>
  <rect x="612" y="263" width="158" height="30" rx="6" fill="#0a84ff15" stroke="#0a84ff30" stroke-width="1"/>
  <circle cx="626" cy="278" r="5" fill="#0a84ff"/>
  <text x="638" y="282" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Unit-01 - Active</text>
  <rect x="612" y="299" width="158" height="30" rx="6" fill="#0a84ff15" stroke="#0a84ff30" stroke-width="1"/>
  <circle cx="626" cy="314" r="5" fill="#00ff87"/>
  <text x="638" y="318" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Unit-04 - Patrol</text>
  <rect x="612" y="335" width="158" height="30" rx="6" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <circle cx="626" cy="350" r="5" fill="#ff3860"/>
  <text x="638" y="354" font-family="Arial,sans-serif" font-size="11" fill="#ff3860">Unit-07 - Response</text>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Police MDT System</text>
</svg>
