<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="blu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0055cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#blu)"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#06091a"/>
  <rect width="800" height="6" fill="url(#blu)"/>
  <text x="40" y="39" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#0a84ff" filter="url(#glow)">Police MDT System</text>
  <text x="270" y="39" font-family="Arial,sans-serif" font-size="13" fill="#ffffff50">Mobile Data Terminal v3.1</text>
  <rect x="620" y="16" width="150" height="28" rx="7" fill="#ff386015" stroke="#ff386050" stroke-width="1"/>
  <circle cx="638" cy="30" r="5" fill="#ff3860" filter="url(#glow)"/>
  <text x="650" y="35" font-family="Arial,sans-serif" font-size="11" fill="#ff3860">3 Active Alerts</text>

  <!-- Left panel -->
  <rect x="20" y="72" width="240" height="365" rx="12" fill="#0a0f1f" stroke="#0a84ff20" stroke-width="1"/>
