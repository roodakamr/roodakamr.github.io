  <rect x="30" y="108" width="220" height="36" rx="8" fill="#10182a" stroke="#0a84ff30" stroke-width="1"/>
  <text x="48" y="130" font-family="Arial,sans-serif" font-size="12" fill="#555577">Search suspect...</text>

  <!-- Filter tabs -->
  <rect x="30" y="152" width="66" height="26" rx="6" fill="#0a84ff"/>
  <text x="63" y="169" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">All</text>
  <rect x="102" y="152" width="66" height="26" rx="6" fill="#10182a"/>
  <text x="135" y="169" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Wanted</text>
  <rect x="174" y="152" width="66" height="26" rx="6" fill="#10182a"/>
  <text x="207" y="169" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Logs</text>

  <!-- Suspect 1 - Wanted -->
  <rect x="30" y="190" width="220" height="54" rx="8" fill="#ff386012" stroke="#ff386040" stroke-width="1"/>
  <circle cx="54" cy="217" r="16" fill="#ff386025"/>
  <rect x="48" y="208" width="12" height="18" rx="2" fill="#ff386050"/>
  <rect x="62" y="208" width="12" height="18" rx="2" fill="#ff386050"/>
  <text x="75" y="210" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Khalid Al-Mutairi</text>
  <text x="75" y="226" font-family="Arial,sans-serif" font-size="10" fill="#ff3860">Wanted for Arrest</text>
  <text x="75" y="238" font-family="Arial,sans-serif" font-size="9" fill="#555577">ID: #4721</text>

  <!-- Suspect 2 - Clean -->
  <rect x="30" y="250" width="220" height="54" rx="8" fill="#10182a" stroke="#0a84ff20" stroke-width="1"/>
  <circle cx="54" cy="277" r="16" fill="#0a84ff20"/>
  <rect x="48" y="268" width="12" height="18" rx="2" fill="#0a84ff40"/>
  <rect x="62" y="268" width="12" height="18" rx="2" fill="#0a84ff40"/>
  <text x="75" y="270" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e0e0f0">Ahmed Al-Sahli</text>
  <text x="75" y="286" font-family="Arial,sans-serif" font-size="10" fill="#00ff87">Clean Record</text>
  <text x="75" y="298" font-family="Arial,sans-serif" font-size="9" fill="#555577">ID: #3892</text>

  <!-- Suspect 3 - Warning -->
  <rect x="30" y="310" width="220" height="54" rx="8" fill="#ffd70010" stroke="#ffd70030" stroke-width="1"/>
  <circle cx="54" cy="337" r="16" fill="#ffd70020"/>
  <rect x="48" y="328" width="12" height="18" rx="2" fill="#ffd70050"/>
  <rect x="62" y="328" width="12" height="18" rx="2" fill="#ffd70050"/>
