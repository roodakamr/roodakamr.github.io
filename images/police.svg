  <rect x="272" y="72" width="318" height="365" rx="12" fill="#0a0f1f" stroke="#0a84ff20" stroke-width="1"/>
  <rect x="272" y="72" width="318" height="82" rx="12" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <rect x="272" y="132" width="318" height="22" fill="#ff386015"/>
  <circle cx="318" cy="113" r="30" fill="#ff386025" stroke="#ff3860" stroke-width="2"/>
  <rect x="308" y="100" width="20" height="26" rx="2" fill="#ff386060"/>
  <text x="365" y="100" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff">Khalid Al-Mutairi</text>
  <rect x="365" y="106" width="82" height="19" rx="5" fill="#ff3860"/>
  <text x="406" y="119" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">WANTED</text>
  <text x="365" y="142" font-family="Arial,sans-serif" font-size="10" fill="#aaa">ID: #4721  |  Age: 28</text>

