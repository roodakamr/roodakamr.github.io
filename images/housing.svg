<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080a12"/>
      <stop offset="100%" style="stop-color:#0a0e18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="58" fill="#0a0d18"/>

  <!-- Header -->
  <text x="30" y="38" font-family="Arial" font-size="20" font-weight="bold" fill="#ffd700" filter="url(#glow)">🏠 سوق العقارات</text>
  <text x="265" y="38" font-family="Arial" font-size="12" fill="#888899">اختر منزل أحلامك</text>
  <rect x="610" y="16" width="160" height="28" rx="7" fill="#ffd70015" stroke="#ffd70040" stroke-width="1"/>
  <text x="650" y="34" font-family="Arial" font-size="12" fill="#ffd700">💰 $45,200</text>

  <!-- Left - Property list -->
  <rect x="20" y="72" width="250" height="365" rx="12" fill="#0d1020" stroke="#ffd70020" stroke-width="1"/>
  <text x="35" y="99" font-family="Arial" font-size="13" font-weight="bold" fill="#e8e8f0">🔍 العقارات المتاحة</text>

  <!-- Filter -->
  <rect x="30" y="108" width="55" height="24" rx="6" fill="#ffd700"/>
  <text x="40" y="124" font-family="Arial" font-size="10" font-weight="bold" fill="#000">شراء</text>
  <rect x="91" y="108" width="55" height="24" rx="6" fill="#1a1a2e"/>
  <text x="101" y="124" font-family="Arial" font-size="10" fill="#888">إيجار</text>
  <rect x="152" y="108" width="55" height="24" rx="6" fill="#1a1a2e"/>
  <text x="157" y="124" font-family="Arial" font-size="10" fill="#888">الكل</text>

  <!-- House 1 - Selected -->
  <rect x="30" y="142" width="225" height="75" rx="10" fill="#ffd70015" stroke="#ffd70050" stroke-width="2"/>
  <rect x="30" y="142" width="4" height="75" rx="2" fill="#ffd700"/>
  <text x="46" y="165" font-family="Arial" font-size="24">🏡</text>
  <text x="78" y="163" font-family="Arial" font-size="13" font-weight="bold" fill="#e8e8f0">فيلا السنترال</text>
  <text x="78" y="178" font-family="Arial" font-size="10" fill="#888899">4 غرف • حمامان • مسبح</text>
  <text x="78" y="196" font-family="Arial" font-size="14" font-weight="bold" fill="#ffd700">$285,000</text>
  <rect x="190" y="155" width="55" height="18" rx="5" fill="#ffd70015" stroke="#ffd70040" stroke-width="1"/>
  <text x="198" y="168" font-family="Arial" font-size="9" fill="#ffd700">مميز ⭐</text>

  <!-- House 2 -->
  <rect x="30" y="223" width="225" height="70" rx="10" fill="#12121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="245" font-family="Arial" font-size="20">🏠</text>
  <text x="76" y="245" font-family="Arial" font-size="13" font-weight="bold" fill="#e8e8f0">شقة المدينة</text>
  <text x="76" y="260" font-family="Arial" font-size="10" fill="#888899">2 غرفة • حمام</text>
  <text x="76" y="280" font-family="Arial" font-size="13" font-weight="bold" fill="#00ff87">$85,000</text>

  <!-- House 3 -->
  <rect x="30" y="299" width="225" height="70" rx="10" fill="#12121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="321" font-family="Arial" font-size="20">🏢</text>
  <text x="76" y="321" font-family="Arial" font-size="13" font-weight="bold" fill="#e8e8f0">بنتهاوس اللوكس</text>
  <text x="76" y="336" font-family="Arial" font-size="10" fill="#888899">6 غرف • خاصة جداً</text>
  <text x="76" y="356" font-family="Arial" font-size="13" font-weight="bold" fill="#ffd700">$650,000</text>

  <!-- House 4 -->
  <rect x="30" y="375" width="225" height="50" rx="10" fill="#12121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="46" y="397" font-family="Arial" font-size="18">🏘</text>
  <text x="72" y="397" font-family="Arial" font-size="12" font-weight="bold" fill="#e8e8f0">منزل الضاحية</text>
  <text x="72" y="413" font-family="Arial" font-size="12" font-weight="bold" fill="#0a84ff">إيجار $2,000/شهر</text>

  <!-- Center - 3D House Preview -->
  <rect x="285" y="72" width="310" height="260" rx="12" fill="#0d1020" stroke="#ffd70020" stroke-width="1"/>
  <text x="440" y="99" font-family="Arial" font-size="14" font-weight="bold" fill="#e8e8f0" text-anchor="middle">فيلا السنترال - معاينة</text>

  <!-- House illustration -->
  <g transform="translate(380, 190)">
    <!-- House base -->
    <rect x="-80" y="-30" width="160" height="90" fill="#1e2a3e" rx="4"/>
    <!-- Roof -->
    <polygon points="-95,-30 0,-90 95,-30" fill="#253040"/>
    <polygon points="-85,-30 0,-82 85,-30" fill="#2a3550"/>
    <!-- Windows -->
    <rect x="-60" y="-15" width="35" height="35" rx="3" fill="#0a84ff25" stroke="#0a84ff40" stroke-width="1"/>
    <line x1="-42" y1="-15" x2="-42" y2="20" stroke="#0a84ff30" stroke-width="1"/>
    <line x1="-60" y1="2" x2="-25" y2="2" stroke="#0a84ff30" stroke-width="1"/>
    <rect x="25" y="-15" width="35" height="35" rx="3" fill="#0a84ff25" stroke="#0a84ff40" stroke-width="1"/>
    <line x1="43" y1="-15" x2="43" y2="20" stroke="#0a84ff30" stroke-width="1"/>
    <line x1="25" y1="2" x2="60" y2="2" stroke="#0a84ff30" stroke-width="1"/>
    <!-- Door -->
    <rect x="-18" y="15" width="36" height="45" rx="3" fill="#ffd70030" stroke="#ffd70060" stroke-width="1"/>
    <circle cx="12" cy="38" r="3" fill="#ffd700"/>
    <!-- Ground -->
    <rect x="-100" y="60" width="200" height="8" rx="4" fill="#1a2030"/>
    <!-- Pool hint -->
    <rect x="-80" y="70" width="50" height="25" rx="4" fill="#0a84ff20" stroke="#0a84ff40" stroke-width="1"/>
    <text x="-55" y="86" font-family="Arial" font-size="8" fill="#0a84ff" text-anchor="middle">مسبح</text>
  </g>

  <!-- 360 button -->
  <rect x="355" y="300" width="90" height="24" rx="6" fill="#ffd70015" stroke="#ffd70040" stroke-width="1"/>
  <text x="400" y="316" font-family="Arial" font-size="11" fill="#ffd700" text-anchor="middle">↻ عرض 360°</text>

  <!-- Tags -->
  <rect x="295" y="310" width="55" height="20" rx="5" fill="#00ff8715" stroke="#00ff8730" stroke-width="1"/>
  <text x="306" y="324" font-family="Arial" font-size="9" fill="#00ff87">متاح ✓</text>
  <rect x="455" y="310" width="55" height="20" rx="5" fill="#0a84ff15" stroke="#0a84ff30" stroke-width="1"/>
  <text x="462" y="324" font-family="Arial" font-size="9" fill="#0a84ff">مسبح 🏊</text>

  <!-- Bottom Details -->
  <rect x="285" y="342" width="310" height="95" rx="12" fill="#0d1020" stroke="#ffd70020" stroke-width="1"/>
  <text x="300" y="365" font-family="Arial" font-size="12" fill="#888899">مميزات العقار</text>

  <text x="300" y="385" font-family="Arial" font-size="11" fill="#e8e8f0">🛏 4 غرف نوم</text>
  <text x="300" y="403" font-family="Arial" font-size="11" fill="#e8e8f0">🔒 نظام أمان</text>
  <text x="430" y="385" font-family="Arial" font-size="11" fill="#e8e8f0">🏊 مسبح خاص</text>
  <text x="430" y="403" font-family="Arial" font-size="11" fill="#e8e8f0">🚗 كراج 3 سيارات</text>
  <text x="300" y="421" font-family="Arial" font-size="11" fill="#e8e8f0">👥 استضافة 8 أشخاص</text>
  <text x="430" y="421" font-family="Arial" font-size="11" fill="#e8e8f0">📦 تخزين 200 عنصر</text>

  <!-- Right - Purchase Panel -->
  <rect x="610" y="72" width="170" height="365" rx="12" fill="#0d1020" stroke="#ffd70020" stroke-width="1"/>

  <rect x="622" y="90" width="146" height="65" rx="10" fill="#ffd70015"/>
  <text x="695" y="112" font-family="Arial" font-size="11" fill="#888899" text-anchor="middle">سعر الشراء</text>
  <text x="695" y="140" font-family="Arial" font-size="22" font-weight="bold" fill="#ffd700" text-anchor="middle" filter="url(#glow)">$285,000</text>

  <rect x="622" y="165" width="146" height="50" rx="10" fill="#12182a"/>
  <text x="695" y="185" font-family="Arial" font-size="11" fill="#888899" text-anchor="middle">رصيدك الحالي</text>
  <text x="695" y="207" font-family="Arial" font-size="18" font-weight="bold" fill="#00ff87" text-anchor="middle">$45,200</text>

  <!-- Mortgage option -->
  <rect x="622" y="225" width="146" height="70" rx="10" fill="#0a84ff10" stroke="#0a84ff25" stroke-width="1"/>
  <text x="695" y="244" font-family="Arial" font-size="11" fill="#0a84ff" text-anchor="middle">💳 قرض بنكي</text>
  <text x="695" y="262" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">$5,700 / شهر</text>
  <text x="695" y="280" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">لمدة 50 شهر</text>

  <!-- Buy button -->
  <rect x="622" y="305" width="146" height="38" rx="10" fill="#ffd700"/>
  <text x="695" y="329" font-family="Arial" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">شراء الآن 🏠</text>

  <!-- Loan button -->
  <rect x="622" y="350" width="146" height="38" rx="10" fill="#0a84ff20" stroke="#0a84ff50" stroke-width="1"/>
  <text x="695" y="374" font-family="Arial" font-size="12" fill="#0a84ff" text-anchor="middle">طلب قرض</text>

  <!-- Favorite -->
  <rect x="622" y="395" width="68" height="32" rx="8" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <text x="656" y="415" font-family="Arial" font-size="14" text-anchor="middle">🤍</text>
  <rect x="697" y="395" width="71" height="32" rx="8" fill="#1a1a2e" stroke="#ffffff10" stroke-width="1"/>
  <text x="732" y="413" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">مشاركة</text>

  <text x="400" y="440" font-family="Arial" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts • نظام المنازل الكامل</text>
</svg>
