<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e6b800"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="6" fill="url(#gold)"/>
  <rect x="0" y="0" width="800" height="60" fill="#06080f"/>
  <rect width="800" height="6" fill="url(#gold)"/>
  <text x="36" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffd700" filter="url(#glow)">Housing Market</text>
  <text x="225" y="38" font-family="Arial,sans-serif" font-size="13" fill="#ffffff50">Find Your Dream Home</text>
  <rect x="610" y="17" width="160" height="28" rx="7" fill="#ffd70015" stroke="#ffd70050" stroke-width="1"/>
  <text x="645" y="35" font-family="Arial,sans-serif" font-size="13" fill="#ffd700">Balance: $45,200</text>

  <!-- Left - Property List -->
  <rect x="20" y="72" width="248" height="365" rx="12" fill="#0c0e1a" stroke="#ffd70020" stroke-width="1"/>
  <text x="36" y="99" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Available Properties</text>
  <!-- Filter -->
  <rect x="30" y="108" width="60" height="24" rx="6" fill="#ffd700"/>
  <text x="60" y="124" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">Buy</text>
  <rect x="96" y="108" width="60" height="24" rx="6" fill="#151525"/>
  <text x="126" y="124" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">Rent</text>
  <rect x="162" y="108" width="60" height="24" rx="6" fill="#151525"/>
  <text x="192" y="124" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">All</text>

  <!-- House 1 - Selected -->
  <rect x="28" y="140" width="226" height="78" rx="10" fill="#ffd70015" stroke="#ffd70060" stroke-width="2"/>
  <rect x="28" y="140" width="5" height="78" rx="2" fill="#ffd700"/>
  <rect x="42" y="152" width="50" height="50" rx="6" fill="#1a1a2e"/>
  <polygon points="42,172 67,152 92,172" fill="#252535"/>
  <rect x="50" y="172" width="34" height="30" fill="#1e2038"/>
  <rect x="56" y="176" width="10" height="12" rx="1" fill="#0a84ff30"/>
  <rect x="70" y="176" width="10" height="12" rx="1" fill="#0a84ff30"/>
  <text x="102" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Villa Central</text>
  <text x="102" y="179" font-family="Arial,sans-serif" font-size="10" fill="#888">4 bed - 2 bath - Pool</text>
  <text x="102" y="198" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffd700">$285,000</text>
  <rect x="196" y="152" width="50" height="18" rx="5" fill="#ffd70025"/>
  <text x="221" y="165" font-family="Arial,sans-serif" font-size="9" fill="#ffd700" text-anchor="middle">Featured</text>

  <!-- House 2 -->
  <rect x="28" y="224" width="226" height="68" rx="10" fill="#10121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="44" y="248" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">City Apartment</text>
  <text x="44" y="264" font-family="Arial,sans-serif" font-size="10" fill="#888">2 bed - 1 bath</text>
  <text x="44" y="282" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#00ff87">$85,000</text>

  <!-- House 3 -->
  <rect x="28" y="298" width="226" height="68" rx="10" fill="#10121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="44" y="322" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Luxury Penthouse</text>
  <text x="44" y="338" font-family="Arial,sans-serif" font-size="10" fill="#888">6 bed - Very Private</text>
  <text x="44" y="356" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffd700">$650,000</text>

  <!-- House 4 -->
  <rect x="28" y="372" width="226" height="52" rx="10" fill="#10121e" stroke="#ffffff10" stroke-width="1"/>
  <text x="44" y="396" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0">Suburb House</text>
  <text x="44" y="413" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0a84ff">Rent $2,000/mo</text>

  <!-- Center - House Preview -->
  <rect x="282" y="72" width="314" height="268" rx="12" fill="#0c0e1a" stroke="#ffd70020" stroke-width="1"/>
  <text x="439" y="99" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0" text-anchor="middle">Villa Central - Preview</text>

  <!-- House 3D illustration -->
  <g transform="translate(438, 210)">
    <!-- Ground -->
    <rect x="-140" y="65" width="280" height="10" rx="4" fill="#1a1a2a"/>
    <!-- House base -->
    <rect x="-90" y="-30" width="180" height="95" rx="5" fill="#1e2a3e"/>
    <!-- Roof -->
    <polygon points="-100,-30 0,-90 100,-30" fill="#263050"/>
    <polygon points="-90,-30 0,-82 90,-30" fill="#2a3560"/>
    <!-- Walls detail -->
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#ffffff10" stroke-width="1"/>
    <!-- Windows left -->
    <rect x="-70" y="-20" width="38" height="38" rx="4" fill="#0a84ff20" stroke="#0a84ff40" stroke-width="1"/>
    <line x1="-51" y1="-20" x2="-51" y2="18" stroke="#0a84ff30" stroke-width="1"/>
    <line x1="-70" y1="-1" x2="-32" y2="-1" stroke="#0a84ff30" stroke-width="1"/>
    <!-- Windows right -->
    <rect x="32" y="-20" width="38" height="38" rx="4" fill="#0a84ff20" stroke="#0a84ff40" stroke-width="1"/>
    <line x1="51" y1="-20" x2="51" y2="18" stroke="#0a84ff30" stroke-width="1"/>
    <line x1="32" y1="-1" x2="70" y2="-1" stroke="#0a84ff30" stroke-width="1"/>
    <!-- Door -->
    <rect x="-20" y="18" width="40" height="47" rx="4" fill="#ffd70025" stroke="#ffd70060" stroke-width="1.5"/>
    <circle cx="14" cy="42" r="3" fill="#ffd700"/>
    <!-- Pool -->
    <rect x="-90" y="72" width="55" height="30" rx="5" fill="#0a84ff20" stroke="#0a84ff40" stroke-width="1"/>
    <text x="-62" y="91" font-family="Arial,sans-serif" font-size="9" fill="#0a84ff" text-anchor="middle">Pool</text>
    <!-- Trees -->
    <circle cx="110" cy="40" r="18" fill="#00ff8720"/>
    <rect x="107" y="56" width="6" height="14" fill="#1a2030"/>
    <circle cx="-115" cy="45" r="15" fill="#00ff8715"/>
    <rect x="-118" y="58" width="6" height="12" fill="#1a2030"/>
  </g>

  <!-- Tags -->
  <rect x="295" y="328" width="60" height="20" rx="5" fill="#00ff8715" stroke="#00ff8830" stroke-width="1"/>
  <text x="325" y="342" font-family="Arial,sans-serif" font-size="9" fill="#00ff87" text-anchor="middle">Available</text>
  <rect x="365" y="328" width="60" height="20" rx="5" fill="#0a84ff15" stroke="#0a84ff30" stroke-width="1"/>
  <text x="395" y="342" font-family="Arial,sans-serif" font-size="9" fill="#0a84ff" text-anchor="middle">Pool</text>
  <rect x="435" y="328" width="65" height="20" rx="5" fill="#ffd70015" stroke="#ffd70030" stroke-width="1"/>
  <text x="467" y="342" font-family="Arial,sans-serif" font-size="9" fill="#ffd700" text-anchor="middle">Garage 3</text>
  <rect x="510" y="328" width="70" height="20" rx="5" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <text x="545" y="342" font-family="Arial,sans-serif" font-size="9" fill="#ff3860" text-anchor="middle">Security</text>

  <!-- Bottom features -->
  <rect x="282" y="354" width="314" height="83" rx="12" fill="#0c0e1a" stroke="#ffd70020" stroke-width="1"/>
  <text x="298" y="376" font-family="Arial,sans-serif" font-size="11" fill="#888">Property Features</text>
  <text x="298" y="398" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">4 Bedrooms</text>
  <text x="298" y="416" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Private Pool</text>
  <text x="430" y="398" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">Security System</text>
  <text x="430" y="416" font-family="Arial,sans-serif" font-size="11" fill="#e0e0f0">3-Car Garage</text>

  <!-- Right - Purchase Panel -->
  <rect x="610" y="72" width="170" height="365" rx="12" fill="#0c0e1a" stroke="#ffd70020" stroke-width="1"/>
  <rect x="622" y="90" width="146" height="68" rx="10" fill="#ffd70015"/>
  <text x="695" y="112" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Purchase Price</text>
  <text x="695" y="145" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#ffd700" text-anchor="middle" filter="url(#glow)">$285,000</text>

  <rect x="622" y="168" width="146" height="52" rx="10" fill="#10121e"/>
  <text x="695" y="188" font-family="Arial,sans-serif" font-size="11" fill="#888" text-anchor="middle">Your Balance</text>
  <text x="695" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#00ff87" text-anchor="middle">$45,200</text>

  <rect x="622" y="230" width="146" height="72" rx="10" fill="#0a84ff10" stroke="#0a84ff25" stroke-width="1"/>
  <text x="695" y="250" font-family="Arial,sans-serif" font-size="11" fill="#0a84ff" text-anchor="middle">Bank Loan</text>
  <text x="695" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e0e0f0" text-anchor="middle">$5,700 / mo</text>
  <text x="695" y="290" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">for 50 months</text>

  <rect x="622" y="314" width="146" height="40" rx="10" fill="url(#gold)"/>
  <text x="695" y="339" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Buy Now</text>

  <rect x="622" y="362" width="146" height="40" rx="10" fill="#0a84ff20" stroke="#0a84ff50" stroke-width="1"/>
  <text x="695" y="387" font-family="Arial,sans-serif" font-size="13" fill="#0a84ff" text-anchor="middle">Apply for Loan</text>

  <rect x="622" y="410" width="68" height="22" rx="6" fill="#ff386015" stroke="#ff386030" stroke-width="1"/>
  <text x="656" y="425" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">&#9825;</text>
  <rect x="696" y="410" width="72" height="22" rx="6" fill="#151525" stroke="#ffffff10" stroke-width="1"/>
  <text x="732" y="425" font-family="Arial,sans-serif" font-size="10" fill="#888" text-anchor="middle">Share</text>

  <text x="400" y="440" font-family="Arial,sans-serif" font-size="11" fill="#ffffff15" text-anchor="middle">RoodaScripts - Full Housing System</text>
</svg>
